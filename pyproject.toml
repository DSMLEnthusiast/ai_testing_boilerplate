[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-mcp-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["jsonschema>=4", "pytest>=7"]
live = ["deepeval[inspect]", "github-copilot-sdk"]
redteam = ["deepteam"]
reporting = ["matplotlib>=3.5", "plotly>=5.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
